; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = espressif32
board = esp32s3box
framework = arduino
lib_deps = bblanchon/ArduinoJson@7.4.3
monitor_port = COM11
monitor_speed = 115200
build_flags = 
    -DUSE_TINYUSB
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
upload_port = COM11
upload_speed = 460800
board_build.psram_mode = octal
board_build.memory_type = qio_opi
; Software partition layout only: 3MB app, fits within 4MB of the configured flash.
; USB updates are supported; dual-slot OTA is not enabled by this layout.
board_build.partitions = huge_app.csv
